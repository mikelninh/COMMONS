name: World Model Hypothesis Lab

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/commons/hypothesis_lab.py"
      - "scripts/run_hypothesis_lab.py"
      - "src/commons/revision_lab.py"
      - "scripts/run_revision_lab.py"
      - "src/commons/river_attention_lab.py"
      - "scripts/run_river_attention_lab.py"
      - "src/commons/attention_rule_lab.py"
      - "scripts/run_attention_rule_lab.py"
      - "src/commons/watch_alert_lab.py"
      - "scripts/run_watch_alert_lab.py"
      - "src/commons/watch_value_lab.py"
      - "scripts/run_watch_value_lab.py"
      - "src/commons/human_attention_lab.py"
      - "scripts/run_human_attention_lab.py"
      - "src/commons/attention_budget_lab.py"
      - "scripts/run_attention_budget_lab.py"
      - ".github/workflows/hypothesis-lab.yml"

permissions:
  contents: write

concurrency:
  group: "world-model-hypothesis-lab"
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install COMMONS
        run: pip install -e .

      - name: Backtest forecast revisions
        run: |
          python scripts/run_revision_lab.py \
            --output public/world-model/revision-report.json

      - name: Backtest river attention trajectory
        run: |
          python scripts/run_river_attention_lab.py \
            --output public/world-model/river-attention-report.json

      - name: Backtest attention rule
        run: |
          python scripts/run_attention_rule_lab.py \
            --output public/world-model/attention-rule-report.json

      - name: Backtest WATCH versus ALERT tiers
        run: |
          python scripts/run_watch_alert_lab.py \
            --output public/world-model/watch-alert-report.json

      - name: Backtest revision value for WATCH ranking
        run: |
          python scripts/run_watch_value_lab.py \
            --output public/world-model/watch-value-report.json

      - name: Build H16 human attention benchmark
        run: |
          python scripts/run_human_attention_lab.py \
            --output public/world-model/attention-cases.json

      - name: Backtest fixed human attention budgets
        run: |
          python scripts/run_attention_budget_lab.py \
            --output public/world-model/attention-budget-report.json

      - name: Run rolling research backtest
        run: |
          python scripts/run_hypothesis_lab.py \
            --output public/world-model/hypothesis-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: world-model-hypothesis-report
          path: public/world-model/hypothesis-report.json
          retention-days: 30

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-hypothesis-lab"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/world-model/hypothesis-report.json \
            public/world-model/revision-report.json \
            public/world-model/river-attention-report.json \
            public/world-model/attention-rule-report.json \
            public/world-model/watch-alert-report.json \
            public/world-model/watch-value-report.json \
            public/world-model/attention-cases.json \
            public/world-model/attention-budget-report.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "hypothesis lab weekly backtest"
            git push origin HEAD:main
          fi
