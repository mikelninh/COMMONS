name: World Model Hypothesis Lab

on:
  push:
    branches: ["world-model-hypothesis-lab-v1"]
    paths:
      - "src/commons/hypothesis_lab.py"
      - "scripts/run_hypothesis_lab.py"
      - ".github/workflows/hypothesis-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: world-model-hypothesis-lab-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install COMMONS
        run: pip install -e .

      - name: Run research backtest
        run: |
          python scripts/run_hypothesis_lab.py             --start-date 2026-07-01             --end-date 2026-09-05             --output public/world-model/hypothesis-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: world-model-hypothesis-report
          path: public/world-model/hypothesis-report.json
          retention-days: 30

      - name: Commit report to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-hypothesis-lab"
          git config user.email "actions@users.noreply.github.com"
          git add public/world-model/hypothesis-report.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "hypothesis lab backtest report"
            git push origin HEAD:world-model-hypothesis-lab-v1
          fi
