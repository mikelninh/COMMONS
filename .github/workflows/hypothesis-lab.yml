name: World Model Hypothesis Lab

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/commons/hypothesis_lab.py"
      - "scripts/run_hypothesis_lab.py"
      - ".github/workflows/hypothesis-lab.yml"

permissions:
  contents: write

concurrency:
  group: "world-model-hypothesis-lab"
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install COMMONS
        run: pip install -e .

      - name: Run rolling research backtest
        run: |
          python scripts/run_hypothesis_lab.py \
            --output public/world-model/hypothesis-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: world-model-hypothesis-report
          path: public/world-model/hypothesis-report.json
          retention-days: 30

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-hypothesis-lab"
          git config user.email "actions@users.noreply.github.com"
          git add public/world-model/hypothesis-report.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "hypothesis lab weekly backtest"
            git push origin HEAD:main
          fi
