name: WATCH ALERT H15

on:
  push:
    branches: ["world-model-watch-alert-v1"]
    paths:
      - "src/commons/watch_alert_lab.py"
      - "scripts/run_watch_alert_lab.py"
      - ".github/workflows/watch-alert-h15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: world-model-watch-alert-v1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install COMMONS
        run: pip install -e .
      - name: Run H15
        run: |
          python scripts/run_watch_alert_lab.py \
            --start-date 2026-07-01 \
            --end-date 2026-09-05 \
            --output public/world-model/watch-alert-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: watch-alert-h15-report
          path: public/world-model/watch-alert-report.json
          retention-days: 30
