name: CITY THREAD v0.7 — The Brief release gate

on:
  pull_request:
    paths:
      - "public/city-thread/brief/**"
      - "public/city-thread/index.html"
      - "public/city-thread/styles.css"
      - "scripts/city-thread-v07-*.py"
      - "scripts/city-thread-v07-*.mjs"
      - ".github/workflows/city-thread-v07-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check mission source syntax
        run: |
          node --check public/city-thread/brief/game.js
          node --check scripts/city-thread-v07-smoke.mjs
          python -m py_compile scripts/city-thread-v07-verify.py
      - name: Install semantic and geometry validators
        run: |
          python -m pip install "shapely>=2,<3" "rdflib>=7,<8" "pyshacl>=0.29,<1"
      - name: Independently validate candidate dilemma and existing RDF/SPARQL/SHACL
        run: |
          python scripts/city-thread-v07-verify.py
          python scripts/city-thread-v04-verify.py
      - name: Install Playwright with Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Play THE BRIEF end to end, desktop and mobile
        run: node scripts/city-thread-v07-smoke.mjs
      - name: Preserve browser screenshots and case file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-thread-v07-the-brief
          path: map-test-results/city-thread-v07-*
          retention-days: 7
