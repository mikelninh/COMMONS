name: River Attention H10

on:
  push:
    branches: ["world-model-revision-lab-v1"]
    paths:
      - "src/commons/river_attention_lab.py"
      - "scripts/run_river_attention_lab.py"
      - ".github/workflows/river-attention-h10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: world-model-revision-lab-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install COMMONS
        run: pip install -e .

      - name: Run H10 river trajectory backtest
        run: |
          python scripts/run_river_attention_lab.py \
            --start-date 2019-01-01 \
            --end-date 2022-07-31 \
            --output public/world-model/river-attention-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: river-attention-h10-report
          path: public/world-model/river-attention-report.json
          retention-days: 30
