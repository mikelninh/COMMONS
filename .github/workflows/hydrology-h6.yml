name: Hydrology Hypothesis H6

on:
  push:
    branches: ["world-model-hypothesis-lab-v1"]
    paths:
      - "src/commons/hydrology_lab.py"
      - "scripts/run_hydrology_lab.py"
      - ".github/workflows/hydrology-h6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: world-model-hypothesis-lab-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install COMMONS
        run: pip install -e .

      - name: Test antecedent wetness hypothesis
        run: |
          python scripts/run_hydrology_lab.py             --start-date 2019-01-01             --end-date 2022-07-31             --output public/world-model/hydrology-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: hydrology-h6-report
          path: public/world-model/hydrology-report.json
          retention-days: 30
