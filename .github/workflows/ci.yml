name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source and scripts
        run: python -m compileall -q src scripts
      - name: Test deterministic core and adversarial invariants
        run: pytest -q
      - name: Simulate capability network
        run: python scripts/simulate_capability_network.py
      - name: Simulate mixed human-AI network
        run: python scripts/simulate_mixed_capabilities.py
      - name: Simulate freight coordination edge cases
        run: python scripts/simulate_freight_coordination.py
