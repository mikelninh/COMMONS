name: Impact v0 Fast Run 5

on:
  push:
    branches: ["impact-v0-fast-run-5"]
    paths:
      - ".github/workflows/impact-v0-fast-5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile and test
        run: |
          python -m compileall -q src scripts
          pytest -q
      - name: Run Impact v0
        run: |
          python scripts/run_impact_lab.py             --exposure-report public/world-model/exposure-report.json             --output public/world-model/impact-report.json
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "commons-impact-fast"
          git config user.email "actions@users.noreply.github.com"
          git add public/world-model/impact-report.json
          if git diff --cached --quiet; then
            echo "Impact report unchanged"
          else
            git commit -m "Impact v0 mature-benchmark result"
            git push origin HEAD:impact-v0-fast-run-5
          fi
