name: Berlin Pulse Tape

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect_berlin_pulse.py"
      - ".github/workflows/berlin-pulse.yml"
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berlin-pulse-tape
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out COMMONS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pulse Python
        run: |
          python -m py_compile scripts/collect_berlin_pulse.py
          python -m py_compile tests/test_berlin_pulse.py

      - name: Record Berlin Pulse
        run: python scripts/collect_berlin_pulse.py

      - name: Commit the tape when it changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data/berlin-pulse)" ]; then
            echo "No Pulse data change."
            exit 0
          fi
          git config user.name "commons-pulse-bot"
          git config user.email "commons-pulse-bot@users.noreply.github.com"
          git add public/data/berlin-pulse
          git commit -m "data: record Berlin Pulse $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
