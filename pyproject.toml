[project]
name = "commons-intelligence"
version = "0.3.0a0"
description = "Open intelligence infrastructure for turning human needs into accountable action."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "pydantic>=2.11",
  "typesafe-sdk",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx>=0.28",
]

[project.scripts]
commons = "commons.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
